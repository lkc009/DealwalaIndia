name: DealWalaIndia 24/7 (ENHANCED: E-COMMERCE + TRAVEL)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-deals:
    runs-on: ubuntu-latest
    env:
      CLOUD_MODE: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium 2>/dev/null || true

      - name: Restore history
        run: |
          mkdir -p ~/.codex
          if [ -f dealwalaindia_history.json ]; then
            cp dealwalaindia_history.json ~/.codex/dealwalaindia_history.json
          fi

      - name: Setup credentials
        run: |
          mkdir -p ~/.codex
          echo '${{ secrets.TELEGRAM_BOT_CONFIG }}' > ~/.codex/telegram-bridge.json
          echo '${{ secrets.TWITTER_API_CONFIG }}' > ~/.codex/twitter_dealwala.json

      - name: Run ENHANCED poster (E-COMMERCE + TRAVEL)
        run: python post_enhanced_deals.py

      - name: Run legacy poster (backup)
        if: failure()
        run: python post_deals.py

      - name: Commit pool updates
        run: |
          git config user.name "dealwala-bot"
          git config user.email "bot@dealwalaindia.in"
          git add deals_pool.json dealwalaindia_history.json
          git diff --staged --quiet || git commit -m "update pool & history [skip ci]"
          git push
