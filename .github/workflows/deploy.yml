name: DealWalaIndia 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history
        run: |
          mkdir -p ~/.codex
          if [ -f dealwalaindia_history.json ]; then
            cp dealwalaindia_history.json ~/.codex/dealwalaindia_history.json
          fi

      - name: Setup credentials
        run: |
          mkdir -p ~/.codex
          echo '${{ secrets.TELEGRAM_BOT_CONFIG }}' > ~/.codex/telegram-bridge.json
          echo '${{ secrets.TWITTER_API_CONFIG }}' > ~/.codex/twitter_dealwala.json

      - name: Run poster
        run: python post_deals.py

      - name: Save history
        run: |
          if [ -f ~/.codex/dealwalaindia_history.json ]; then
            cp ~/.codex/dealwalaindia_history.json .
            git config user.name "dealwala-bot"
            git config user.email "bot@dealwalaindia.in"
            git add dealwalaindia_history.json
            git diff --staged --quiet || git commit -m "update deal history [skip ci]"
            git push
          fi
